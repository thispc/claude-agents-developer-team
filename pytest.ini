[pytest]
# tests/ is the conductor's e2e suite; services/ holds each fleet service's own
# offline suite (smoke + Schemathesis contract), per SERVICE_CONTRACT.md rule 6.
testpaths = tests services
norecursedirs = tests/legacy
# The live e2e test spends real tokens, so it is deselected by default even when
# E2E_LIVE=1 is exported from .env. Run it explicitly with:  pytest -m live
addopts = -q -m "not live"
asyncio_mode = auto
markers =
    hostonly: needs the repo checkout or host tooling; not runnable inside the image
    live: real end-to-end run that spends tokens and needs real credentials
filterwarnings =
    ignore::DeprecationWarning
