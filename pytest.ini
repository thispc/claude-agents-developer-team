[pytest]
testpaths = tests
norecursedirs = tests/legacy
# The live e2e test spends real tokens, so it is deselected by default even when
# E2E_LIVE=1 is exported from .env. Run it explicitly with:  pytest -m live
addopts = -q -m "not live"
asyncio_mode = auto
markers =
    live: real end-to-end run that spends tokens and needs real credentials
filterwarnings =
    ignore::DeprecationWarning
