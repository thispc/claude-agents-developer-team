# services.yaml — the service registry, and the single source the fleet is generated
# from. tools/gen_fleet.py reads this file and writes process-compose.yaml,
# data/env/<name>.env, data/tokens/<name>.token and data/fleet_topology.json.
# Edit HERE and re-run the generator (run-local.sh does) — never edit the outputs.
#
# kinds:
#   core      — the conductor. Managed by process-compose.
#   service   — an extracted microservice (knowledge 8881, usage 8882, notify 8883,
#               watch 8884, lifeworld 8885). Managed by process-compose.
#   ephemeral — short-lived children a platform component spawns and reaps itself.
#   external  — processes a platform component owns on a reserved port range;
#               probed, never started, by the fleet.
# Only core/service entries become process-compose processes; the rest are topology
# facts for the Atlas and the /svc gateway (which refuses to proxy them).
#
# ui: whether the service ships its own panel at /ui/* (proxied same-origin at
# /svc/<name>/ui/ — see SERVICE_CONTRACT.md). false everywhere until a service
# actually serves one; ui_screen: true additionally claims a routed page.
#
# doors: which of the conductor's /internal/* service doors this service may use
#   (bus → POST /internal/bus, tuning → GET /internal/tuning, model → POST
#   /internal/complete, agents → the activity register). The conductor identifies
#   the caller by its own minted token and checks THIS list — being inside the
#   fleet is not a permission.
# knobs: with doors: [tuning], the exact tuning knobs this service may read.
#   Nothing else in the fifty-odd knobs is any of its business.
# peers: which OTHER services this one calls directly. The generator writes that
#   peer's token into this service's env file — an address is public inside the
#   fleet, the credential that opens it is not — so a service→service edge is one
#   reviewed line rather than every token in every env file.
# env: extra environment keys copied from the generating shell into
#   data/env/<name>.env. The escape hatch for a credential that genuinely had to
#   move with the code (notify's GITHUB_TOKEN) — keep every list as short as it
#   can be, and never put a model credential in one.
# public: whether a SIGNED-IN NON-ROOT user may reach this service through the
#   /svc gateway. Absent means false: the gate fails closed, exactly like doors:.
#   Every service here holds operator data — what agents have learned, what the
#   subscription was spent on, what broke — and the conductor's own routes for it
#   are all root-gated. `/api/logs` is root-only because logs name file paths,
#   branch names and the shape of the owner's own work; a gateway that forwarded
#   /svc/watch/logs to any account would hand over the same rows by another door.
#   A project's service that genuinely serves its users declares public: true in
#   one reviewed line, instead of every service leaking by omission.

defaults:
  host: 127.0.0.1
  health_path: /health
  venv: .venv

fleet_api:
  port: 8899        # process-compose's own REST API, token-authed via data/tokens/fleet-api.token

services:
  conductor:
    kind: core
    port: 8787
    health_path: /api/health
    db: devteam.db          # repo root, NOT under data/ — the legacy monolith store
    cmd: .venv/bin/uvicorn app.main:app --app-dir conductor --host 127.0.0.1 --port ${PORT}
    accepts: [worker, verify]   # the shared-token doors it answers (X-Worker-Token, VERIFY_TOKEN)
    ui: false                   # the dashboard IS the shell, not a /svc panel

  knowledge:
    kind: service
    port: 8881
    dir: services/knowledge
    db: data/knowledge.db
    cmd: .venv/bin/uvicorn app:app --app-dir services/knowledge --host 127.0.0.1 --port ${PORT}
    callers: [conductor]        # via its shim conductor/app/knowledge.py, which documents
                                # the degraded modes (recall→[], writes→no-op, stats→degraded)
    ui: false                   # headless — an API-only store, honestly

  usage:
    kind: service
    port: 8882
    dir: services/usage
    db: data/usage.db
    cmd: .venv/bin/uvicorn app:app --app-dir services/usage --host 127.0.0.1 --port ${PORT}
    callers: [conductor]        # via its shim conductor/app/usage.py: note→dropped,
                                # snapshot→zeros+degraded, verdict→FAIL-SAFE with a
                                # bounded 5-minute wake (never spend blind)
    doors: [tuning]             # the meter runs on the owner's dials, not a private copy
    knobs: [usage_window_h, usage_budget_tokens, repair_idle_share, repair_yield_quiet_s]
    ui: false                   # headless — an API-only meter, honestly

  notify:
    kind: service
    port: 8883
    dir: services/notify
    db: data/notify.db
    cmd: .venv/bin/uvicorn app:app --app-dir services/notify --host 127.0.0.1 --port ${PORT}
    callers: [conductor]        # via its shim conductor/app/notify.py: every verb
                                # degrades to {"sent": false, "reason": "notify service down"}
    doors: [bus]                # announces a filed issue through the conductor's bus door
    # The FIRST credential beyond the conductor: the GitHub call moved with the
    # dedup and the ceiling, so the token had to move with it. GIT_API/GIT_PROVIDER
    # are addresses, and the two NOTIFY_* keys are the kill switch and the hourly
    # ceiling. Nothing else — and no model credential ever.
    env: [GITHUB_TOKEN, GIT_API, GIT_PROVIDER, NOTIFY_GITHUB, NOTIFY_MAX_PER_HOUR]
    ui: false                   # headless — it speaks in GitHub issues

  watch:
    kind: service
    port: 8884
    dir: services/watch
    db: data/watch.db
    cmd: .venv/bin/uvicorn app:app --app-dir services/watch --host 127.0.0.1 --port ${PORT}
    callers: [conductor]        # via two shims. conductor/app/logs.py batches rows onto an
                                # in-memory queue and a daemon thread posts them, so a log
                                # call never waits on this service and stdout keeps working
                                # when it is down; conductor/app/monitor.py composes its
                                # notices with the two local rules and degrades to those.
    # NO doors. Detection reads log rows and nothing else — the one rule that used
    # to quote a tuning knob says the same thing without it, and a service that
    # could reach back into the conductor is not the isolation this bought. It
    # emits no events either: the actions a notice proposes all run conductor-side.
    ui: false                   # headless — the Improve screen is its face

  lifeworld:
    kind: service
    port: 8885
    dir: services/lifeworld
    db: data/lifeworld.db
    cmd: .venv/bin/uvicorn app:app --app-dir services/lifeworld --host 127.0.0.1 --port ${PORT}
    callers: [conductor]        # via conductor/app/lifeworld_client.py. /api/lw/* stays an
                                # authenticated thin proxy (the dashboard hardcodes those
                                # paths and they must not move); the crew reaches the
                                # seating, deliberation, consult and review endpoints
                                # through the same shim. Degraded: /api/lw/* → 503 honest,
                                # ensure_team → None and the sprint tick sleeps with the
                                # reason "lifeworld down", Atlas room panels "unavailable".
    doors: [model, tuning, agents]
    # model:  the substrate spends the OWNER's quota and holds NO credential — it
    #         sends a prompt and a signed settings reference, and the conductor
    #         resolves it. This is the door the whole phase is judged on.
    # tuning: the world's own dials, read from the screen that sets them.
    # agents: one activity register for the whole platform, so a lifeworld agent
    #         shows up beside workers and crew instead of on a private board.
    knobs: [scene_default_model, scene_utterance_max_tokens,
            agent_session_cap, agent_session_window_s]
    peers: [knowledge]          # an agent recalls what it has learned, directly —
                                # asking the conductor to ask would be two hops for
                                # one answer. This is the fleet's only service→service
                                # edge, and the generator writes KNOWLEDGE_TOKEN into
                                # data/env/lifeworld.env because of this one line.
    ui: false                   # headless — the Studio canvas IS its face, same-origin

  worker-pool:
    kind: ephemeral
    managed_by: launcher        # launcher.py spawns and reaps workers; never in process-compose
    ui: false

  sandbox:
    kind: external
    managed_by: sandbox         # sandbox.py boots/kills the candidate build itself
    port_range: [8500, 8599]
    ui: false

  apps:
    kind: external
    managed_by: deploy          # deploy.py runs project apps on bind-reserved ports
    port_range: [8600, 8799]
    ui: false
