<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devteam — AI dev team console</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>dev<span>team</span></h1>
  <select id="projectSelect" title="Select project"></select>
  <button id="newProjectBtn">+ New project</button>
  <div class="spacer"></div>
  <div id="costBadge" class="badge" title="spent / budget">$0.00</div>
  <div id="statusBadge" class="badge">—</div>
  <button id="restartBtn" hidden title="Re-run the lead agent on this project">↻ Restart lead</button>
  <button id="cancelBtn" class="danger" hidden>Cancel</button>
</header>

<main>
  <div id="left">
    <div class="view-toggle">
      <button class="chip vchip active" data-v="board">Board</button>
      <button class="chip vchip" data-v="dag">DAG</button>
    </div>
    <section id="dag" hidden><svg id="dagSvg" xmlns="http://www.w3.org/2000/svg"></svg></section>
    <section id="board">
    <div class="col" data-col="planned"><h2>Planned</h2><div class="cards"></div></div>
    <div class="col" data-col="working"><h2>In progress</h2><div class="cards"></div></div>
    <div class="col" data-col="review"><h2>Review</h2><div class="cards"></div></div>
    <div class="col" data-col="done"><h2>Done</h2><div class="cards"></div></div>
    </section>
  </div>
  <section id="feed" data-filter="all">
    <div class="feed-head">
      <h2 id="feedTitle">Live activity</h2>
      <div class="chips">
        <button class="chip active" data-f="all">All</button>
        <button class="chip" data-f="manager">Manager</button>
        <button class="chip" data-f="worker">Team</button>
      </div>
    </div>
    <div id="events"></div>
  </section>
</main>

<dialog id="newProjectDialog">
  <form id="newProjectForm" novalidate>
    <h2>New project</h2>
    <label>Project name
      <input name="name" required placeholder="todo-app" autocomplete="off"></label>
    <label>GitHub repo <span class="hint">optional — blank uses the server default</span>
      <input name="repo" placeholder="owner/repo" autocomplete="off"></label>
    <label>Brief <span class="hint">what to build, the stack, and what “done” means</span>
      <textarea name="brief" rows="7" required
        placeholder="Build a URL shortener. FastAPI backend in api/ with POST /shorten and GET /{code}. Static frontend in web/. Done = tester verifies the round-trip."></textarea></label>
    <div class="nums">
      <label>Budget (USD)
        <input name="budget_usd" type="number" step="0.5" min="0.5" value="5"></label>
      <label>Max parallel workers
        <input name="max_workers" type="number" min="1" max="8" value="3"></label>
    </div>
    <p id="formError" class="form-error" hidden></p>
    <div class="actions">
      <button type="button" id="closeDialogBtn">Cancel</button>
      <button type="submit" id="createBtn" class="primary">Start team</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
