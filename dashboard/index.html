<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>devteam — AI dev team console</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 id="homeLink">dev<span>team</span></h1>
  <select id="projectSelect" title="Select project" hidden></select>
  <button id="newProjectBtn">+ New project</button>
  <div class="spacer"></div>
  <div id="authBadge" class="badge">auth: …</div>
  <div id="costBadge" class="badge" hidden>—</div>
  <div id="statusBadge" class="badge" hidden>—</div>
  <button id="restartBtn" hidden title="Re-run the manager on this project">↻ Restart manager</button>
  <button id="cancelBtn" class="danger" hidden>Cancel</button>
</header>

<section id="home">
  <div class="home-head">
    <h2>Projects</h2>
    <button id="homeNewBtn" class="primary">+ New project</button>
  </div>
  <table id="projectsTable">
    <thead><tr><th>#</th><th>Name</th><th>Repo</th><th>Status</th><th>Tasks</th><th>Usage</th><th>Actions</th></tr></thead>
    <tbody id="projectsBody"></tbody>
  </table>
  <p id="homeEmpty" class="empty" hidden>No projects yet. Create one to put your AI team to work.</p>
</section>

<main hidden>
  <div id="left">
    <div class="view-toggle">
      <button class="chip vchip active" data-v="board">Board</button>
      <button class="chip vchip" data-v="dag">DAG</button>
    </div>
    <section id="dag" hidden><svg id="dagSvg" xmlns="http://www.w3.org/2000/svg"></svg></section>
    <section id="board">
    <div class="col" data-col="planned"><h2>Planned</h2><div class="cards"></div></div>
    <div class="col" data-col="working"><h2>In progress</h2><div class="cards"></div></div>
    <div class="col" data-col="review"><h2>Review</h2><div class="cards"></div></div>
    <div class="col" data-col="done"><h2>Done</h2><div class="cards"></div></div>
    </section>
  </div>
  <section id="feed" data-filter="all">
    <div class="feed-head">
      <h2 id="feedTitle">Live activity</h2>
      <div class="chips">
        <button class="chip active" data-f="all">All</button>
        <button class="chip" data-f="manager">Manager</button>
        <button class="chip" data-f="worker">Team</button>
      </div>
    </div>
    <div id="askBanner" hidden>
      <div class="ask-q" id="askText"></div>
      <div class="ask-opts" id="askOpts"></div>
    </div>
    <div id="events"></div>
    <form id="directiveForm" title="Message your manager — delivered at their next decision point">
      <input id="directiveInput" placeholder="Message the manager (e.g. 'add dark mode', 'skip tests, ship it')…" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </section>
</main>

<dialog id="taskDialog">
  <div class="task-detail-wrap">
    <div id="taskDetail"></div>
    <div class="actions"><button type="button" id="closeTaskBtn">Close</button></div>
  </div>
</dialog>

<dialog id="newProjectDialog">
  <form id="newProjectForm" novalidate>
    <h2>New project</h2>
    <label>Project name
      <input name="name" required placeholder="todo-app" autocomplete="off"></label>
    <label>GitHub repo <span class="hint">owner/repo — created automatically (private) if it doesn't exist; blank uses the server default</span>
      <input name="repo" placeholder="owner/repo" autocomplete="off"></label>
    <label>Brief <span class="hint">what to build, the stack, and what “done” means</span>
      <textarea name="brief" rows="7" required
        placeholder="Build a URL shortener. FastAPI backend in api/ with POST /shorten and GET /{code}. Static frontend in web/. Done = tester verifies the round-trip."></textarea></label>
    <div class="nums">
      <label>Max agents per team <span class="hint">parallel workers</span>
        <input name="max_workers" type="number" min="1" max="8" value="3"></label>
      <label>Agent-run cap <span class="hint">runaway guard</span>
        <input name="max_runs" type="number" min="5" max="200" value="40"></label>
    </div>
    <p id="formError" class="form-error" hidden></p>
    <div class="actions">
      <button type="button" id="closeDialogBtn">Cancel</button>
      <button type="submit" id="createBtn" class="primary">Start team</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
