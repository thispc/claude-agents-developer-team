# Local end-to-end run: conductor + dashboard, workers as subprocesses in-container.
# Usage: cp .env.example .env  (fill keys)  ->  docker compose -f deploy/docker-compose.yml up --build
services:
  conductor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.conductor
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # env_file above pulls in the host's .env, where DB_PATH is a RELATIVE path
      # for running outside Docker. Left alone it lands the database at /app,
      # outside the volume below — so every rebuild silently destroyed it.
      DB_PATH: /data/devteam.db
      WORKSPACES_DIR: /data/workspaces
      LAUNCHER: local
      CONDUCTOR_URL: http://localhost:8000
    volumes:
      - devteam-data:/data
volumes:
  devteam-data:
