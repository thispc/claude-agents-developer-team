# Let's Encrypt via HTTP-01: the challenge is served by the same ingress that
# serves the app, so no DNS credentials are needed and nothing has to be bought.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: pulkitchawl@gmail.com
    privateKeySecretRef: {name: letsencrypt-account-key}
    solvers:
      - http01:
          ingress: {ingressClassName: nginx}
---
# Staging issuer: Let's Encrypt rate-limits the real one hard (and nip.io is a
# heavily-used base domain), so a failed attempt against production can lock you
# out for a week. Try here first when debugging.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: pulkitchawl@gmail.com
    privateKeySecretRef: {name: letsencrypt-staging-key}
    solvers:
      - http01:
          ingress: {ingressClassName: nginx}
