# Every value the conductor needs that must not live in a manifest.
#
# PREFER `deploy/k8s/make-secret.sh`, which builds this straight from your .env
# without a plaintext copy ever touching disk. This file exists so you can see
# what the Secret contains and why each key is there.
#
# Copy to secrets.yaml (gitignored), fill in, then:
#   kubectl apply -f deploy/k8s/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: devteam-secrets
  namespace: devteam
type: Opaque
stringData:
  # --- how agents authenticate. ONE of these two, not both. ---------------
  # A subscription token runs agents on your Claude plan with no per-token
  # charge. If ANTHROPIC_API_KEY is also set it WINS and you get billed, which
  # is why the pair is worth being careful about.
  CLAUDE_CODE_OAUTH_TOKEN: "sk-ant-oat01-..."   # from `claude setup-token`
  ANTHROPIC_API_KEY: ""                          # leave blank when using the token

  # --- where the work goes -----------------------------------------------
  GITHUB_TOKEN: "github_pat_..."   # Contents, Issues, Pull requests: read/write
  GITHUB_REPO: "owner/repo"        # default repo when a project names none

  # --- the conductor's own trust boundary --------------------------------
  # Workers authenticate their reports with this. Anyone holding it can post a
  # report as any worker, so treat it like a password and generate it randomly:
  #   openssl rand -hex 32
  WORKER_TOKEN: "generate-a-long-random-string"

  # --- who can sign in ----------------------------------------------------
  # The root account is seeded from these on first boot. Change the password
  # before exposing the service to anything.
  ROOT_USERNAME: "root"
  ROOT_PASSWORD: "change-me"

  # --- optional: extra providers for Plan mode's round table -------------
  # Only needed for seats from more than one vendor. Both are API-key-only —
  # there is no subscription equivalent, so every call on these bills.
  GEMINI_API_KEY: ""
  OPENAI_API_KEY: ""

  # --- optional: who may run self-repair besides root ---------------------
  # Comma-separated usernames. Deliberately set here and not in the app: it
  # grants write access to the repo this platform runs from, so a compromised
  # account must not be able to grant it to itself.
  SELFREPAIR_USERS: ""
