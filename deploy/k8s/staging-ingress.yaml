# Staging on the same load balancer as production.
#
# A second Ingress costs nothing: a LoadBalancer is per-cluster, not per-service,
# which is the reason paying for one beats opening a port per environment.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devteam-conductor
  namespace: devteam-staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: "16m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [staging.152-42-151-175.nip.io]
      secretName: devteam-staging-tls
  rules:
    - host: staging.152-42-151-175.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: devteam-conductor, port: {number: 80}}
---
apiVersion: v1
kind: Service
metadata: {name: devteam-conductor, namespace: devteam-staging}
spec:
  type: ClusterIP
  selector: {app: devteam-conductor}
  ports: [{port: 80, targetPort: 8000}]
