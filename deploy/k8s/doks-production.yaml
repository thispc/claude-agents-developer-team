# Production on DOKS.
#
# Differs from a preview in exactly two ways, and both matter:
#   - it carries REAL credentials, so it can actually run agents
#   - it is NOT in DEMO_MODE, so nothing is simulated
#
# Service is NodePort, not LoadBalancer: DigitalOcean bills every LB, and at this
# scale the node's own IP serves the same purpose for nothing. Swap to an Ingress
# once there is a wildcard domain worth terminating TLS on.
apiVersion: v1
kind: Namespace
metadata: {name: devteam}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: devteam-data, namespace: devteam}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: devteam-conductor, namespace: devteam}
spec:
  replicas: 1
  # The conductor holds a SQLite file on a ReadWriteOnce volume, so two replicas
  # would fight over it. Recreate rather than RollingUpdate for the same reason:
  # the new pod cannot mount the volume until the old one lets go.
  strategy: {type: Recreate}
  selector: {matchLabels: {app: devteam-conductor}}
  template:
    metadata: {labels: {app: devteam-conductor}}
    spec:
      # Without this the pod runs as 'default', which cannot read or patch its own
      # Deployment — so self-repair reaches the last step and fails with Forbidden.
      serviceAccountName: devteam-conductor
      imagePullSecrets: [{name: docr-creds}]
      containers:
        - name: conductor
          # WARNING: applying this manifest RESETS the running image to whatever
          # is written here — including over a version the platform chose for
          # itself. It happened once: an apply silently rolled production back
          # several builds. Treat this file as the bootstrap; after that the
          # image belongs to /api/self/update, and this line will be stale.
          image: registry.digitalocean.com/devteam-pulkit/devteam-conductor:main-307d0865f0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          envFrom:
            - secretRef: {name: devteam-secrets}
          env:
            - {name: DB_PATH, value: /data/devteam.db}
            - {name: WORKSPACES_DIR, value: /data/workspaces}
            - {name: LAUNCHER, value: local}
            - {name: CONDUCTOR_URL, value: "http://devteam-conductor.devteam.svc.cluster.local"}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 3Gi}
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: devteam-data}
---
apiVersion: v1
kind: Service
metadata: {name: devteam-conductor, namespace: devteam}
spec:
  # NodePort: reachable at http://<node-ip>:30080.
  #
  # This exposes the HTTP API and nothing else — no SSH, no filesystem, and the
  # stored credentials are never sent to a browser (auth.redacted returns only
  # whether each key is set). What IS exposed is the control plane for your agents
  # and your repo, so the password became the entire security boundary. Hence the
  # two changes that had to land first: a generated 24-character root password,
  # and a lockout after 8 failed attempts in 5 minutes.
  #
  # Still missing: TLS. Without it the login password crosses the internet in
  # cleartext. Point a hostname here and it becomes an Ingress with Let's Encrypt
  # — one LoadBalancer shared by every environment, which is the point at which
  # $12/month buys something rather than just opening a hole.
  #
  # A NodePort here would be worse than it looks. DOKS reconciles a firewall
  # called k8s-public-access-<cluster> from the NodePort services it finds, and
  # it opens them to 0.0.0.0/0 by default — so exposure is the default and any
  # restriction you apply is something you are holding against the platform's own
  # controller. For a pod holding a Claude subscription token, a GitHub PAT with
  # write access and a WORKER_TOKEN that lets its bearer post as any worker, that
  # is the wrong way round.
  #
  # Reach it with a tunnel instead — no port open, nothing to restrict, free:
  #   kubectl -n devteam port-forward svc/devteam-conductor 8000:80
  #   open http://localhost:8000
  #
  # When it needs a real URL: one Ingress with TLS, shared by every environment.
  # That is the point at which a LoadBalancer earns its $12/month, and TLS plus a
  # single reviewed entry point is a better answer than an open port anyway.
  type: NodePort
  selector: {app: devteam-conductor}
  ports: [{port: 80, targetPort: 8000, nodePort: 30080}]
